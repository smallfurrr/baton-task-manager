server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API is served under /api; forward it to the server container unchanged.
  # Docker's resolver plus a variable makes nginx look the server up per request,
  # so it keeps working if the server container restarts with a new IP.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $api_upstream http://server:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite fingerprints everything under /assets, so it can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Single-page app: unknown paths (e.g. a reload on /tasks/new) get index.html.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
